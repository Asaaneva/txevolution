services:
  backend:
    build:
      context: "./backend"
    ports:
      - "8000:8000"
    # 🔐 Al estar ya dentro de la carpeta, la ruta al .env es directa:
    env_file:
      - "./backend/.env"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: "./frontend"
    ports:
      - "5173:5173"
    volumes:
      - "./frontend:/app"
      - "/app/node_modules"

