services:
  backend:
    build:
      context: "./backend"
    ports:
      - "8000:8000"
    env_file:
      - "./backend/.env"
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
      # ⚡ EL PARCHE DE DOBLE RUTA: Le enseña a Python a buscar tanto en /app (para src.) como en /app/src (para api.)
      - PYTHONPATH=/app:/app/src
    volumes:
      - "./backend:/app"
  frontend:
    build:
      context: "./frontend"
    ports:
      - "5173:5173"
    volumes:
      - "./frontend:/app"
      - "/app/node_modules"
    env_file:
      - "./frontend/.env"
